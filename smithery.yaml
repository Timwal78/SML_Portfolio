# Smithery.ai Configuration for ScriptMasterLabs MCP Server
# https://smithery.ai
version: '1.0'
name: 'squeezeos'
displayName: 'SqueezeOS & ScriptMasterLabs Agent Ecosystem'
description: '33-tool institutional market intelligence, x402 payment firewall, agent credit scoring, and signal futures MCP server.'
author: 'ScriptMasterLabs'
homepage: 'https://scriptmasterlabs.com'
repository: 'https://github.com/Timwal78/SML_Portfolio'

runtime: 'node'
entrypoint: 'npx @scriptmasterlabs/mcp-x402'

capabilities:
  tools: true
  prompts: true
  resources: true

tools:
  - name: 'get_squeeze_scan'
    description: 'Scans US equities for high-conviction short squeeze setup parameters.'
  - name: 'get_council_verdict'
    description: 'Multi-model consensus verdict (BUY/SELL/HOLD) on target tickers.'
  - name: 'get_agent_credit_score'
    description: 'FICO-style (300-850) agent credit score for any XRPL/Base wallet.'
  - name: 'verify_x402_payment'
    description: 'Validates on-chain HTTP 402 payment transaction hash.'

environment:
  BASE_RPC_URL:
    description: 'Base mainnet RPC endpoint'
    required: false
    default: 'https://mainnet.base.org'
  XRPL_RPC_URL:
    description: 'XRPL WebSocket or HTTP node'
    required: false
    default: 'wss://xrplcluster.com'
