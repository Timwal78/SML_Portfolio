[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "swarm-mm"
version = "0.1.0"
description = "Swarm Market Making — 4-variant suite (Signal / Crypto / B2B / Simulated)"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Script Master Labs", email = "timothy.walton45@gmail.com" }]
license = { text = "Proprietary" }
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.7.0",
  "httpx>=0.27.0",
  "redis>=5.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.23.0"]

[project.scripts]
swarm-mm = "swarm_mm.api.app:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["swarm_mm*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning"]
